# Sample config for php-fpm (nginx).
# Copy and modify this template for your debug target.
[www]
user = www-data
group = www-data

listen = 127.0.0.1:9009

pm = static
# pm.max_children=1にしておくことで, リクエストを処理するWorkerを固定できるので, gdbでアタッチしやすい.  
# ただし, ASanなどで, Worker が abortする場合は, 新しい worker側に attach し直すこと.  
pm.max_children = 1 

clear_env = no
catch_workers_output = yes

env[USE_ZEND_ALLOC] = 0
